<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ category }} | TrendMix</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>{{ category }}</h1>

    {% for product in products %}

        <div>
            <h2>{{ product.name }}</h2>
            <p>€ {{ product.price }}</p>
        </div>

    {% endfor %}

</body>

</html>
