<div class="tm-global-language tm-flag-picker" role="group" aria-label="Website language">
  <label for="tmGlobalLanguage" class="tm-lang-label tm-visually-hidden">Taal / Language</label>
  <span class="tm-flag-visual" aria-hidden="true">
    <svg class="tm-flag-icon tm-flag-nl" viewBox="0 0 36 24"><rect width="36" height="8" fill="#AE1C28"/><rect y="8" width="36" height="8" fill="#FFF"/><rect y="16" width="36" height="8" fill="#21468B"/></svg>
    <svg class="tm-flag-icon tm-flag-en" viewBox="0 0 36 24" style="display:none"><rect width="36" height="24" fill="#012169"/><path d="M0 0 36 24M36 0 0 24" stroke="#FFF" stroke-width="6"/><path d="M0 0 36 24M36 0 0 24" stroke="#C8102E" stroke-width="2.5"/><path d="M18 0V24M0 12H36" stroke="#FFF" stroke-width="9"/><path d="M18 0V24M0 12H36" stroke="#C8102E" stroke-width="4.5"/></svg>
  </span>
  <select id="tmGlobalLanguage" aria-label="Taal kiezen / Select language" autocomplete="off">
    <option value="nl">Nederland</option>
    <option value="en">English</option>
  </select>
</div>
<style>
.tm-flag-picker{position:relative!important;display:inline-flex!important;align-items:center!important;gap:0!important;border:1px solid #b8cde7!important;border-radius:11px!important;background:#eaf3ff!important;box-shadow:0 2px 9px #0a2f5a20!important;min-height:41px!important;overflow:hidden}
.tm-flag-picker .tm-flag-visual{pointer-events:none;position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:2;display:flex;align-items:center}
.tm-flag-picker .tm-flag-icon{display:block;width:29px;height:20px;overflow:hidden;border:1px solid #9bb0ca;border-radius:3px;box-shadow:0 1px 3px #0002}
.tm-flag-picker select#tmGlobalLanguage{appearance:none!important;-webkit-appearance:none!important;background:transparent!important;color:#123c70!important;border:0!important;min-width:115px!important;max-width:none!important;height:41px!important;padding:7px 21px 7px 48px!important;font:800 12px/1.2 system-ui,sans-serif!important;cursor:pointer!important}
.tm-flag-picker::after{content:"⌄";position:absolute;right:9px;top:6px;color:#1456a1;font-size:20px;pointer-events:none}
.tm-flag-picker:focus-within{outline:3px solid #f3a52d;outline-offset:2px}
@media(max-width:760px){.tm-flag-picker select#tmGlobalLanguage{min-width:108px!important;padding-left:46px!important}.tm-flag-picker .tm-flag-icon{width:27px;height:19px}}
</style>
<script>
(function(){
  function updateTrendmixFlag(){
    const picker=document.getElementById('tmGlobalLanguage');
    const wrapper=picker&&picker.closest('.tm-flag-picker');
    if(!wrapper)return;
    const isEnglish=picker.value==='en';
    wrapper.querySelector('.tm-flag-nl').style.display=isEnglish?'none':'block';
    wrapper.querySelector('.tm-flag-en').style.display=isEnglish?'block':'none';
  }
  document.addEventListener('DOMContentLoaded',()=>{
    const picker=document.getElementById('tmGlobalLanguage');
    if(!picker)return;
    picker.addEventListener('change',updateTrendmixFlag);
    updateTrendmixFlag();
    new MutationObserver(updateTrendmixFlag).observe(picker,{attributes:true,attributeFilter:['value']});
  });
})();
</script>
