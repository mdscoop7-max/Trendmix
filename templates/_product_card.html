<article class="product-card">
  <a class="product-image" href="/product/{{ product.category_slug }}/{{ product.index }}" aria-label="{{ product.name }}">
    {% if product.image %}<img src="{{ product.image }}" alt="{{ product.name }}" loading="lazy">{% else %}<span class="image-fallback">{{ product.icon|default('🛍️') }}</span>{% endif %}
    <span class="product-badge">TrendMix</span>
  </a>
  <div class="product-body">
    <span class="product-category">{{ product.category_name }}</span>
    <h3><a href="/product/{{ product.category_slug }}/{{ product.index }}">{{ product.name }}</a></h3>
    <div class="product-bottom"><strong>€ {{ "%.2f"|format(product.price) }}</strong><a href="/product/{{ product.category_slug }}/{{ product.index }}" class="round-arrow" aria-label="Bekijk product">→</a></div>
  </div>
</article>
