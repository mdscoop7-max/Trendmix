<article class="product-card product-card--{{ product.category_slug }}" data-product-card data-price="{{ product.price }}" data-name="{{ product.name|lower }}">
  <a class="product-image" href="{{ product.product_url }}" aria-label="{{ product.name }}">
    {% if product.image %}<img src="{{ product.image }}" alt="{{ product.name }}" loading="lazy" decoding="async" data-fallback-icon="{{ product.icon|default('✨') }}" data-product-image>{% else %}<span class="image-fallback">{{ product.icon|default('✨') }}</span>{% endif %}
    {% if product.badge %}<span class="product-badge">{{ product.badge }}</span>{% endif %}
  </a>
  <div class="product-body">
    <div class="product-card-meta"><span class="product-category" data-category-name="{{ product.category_slug }}">{{ product.category_name }}</span><span class="product-card-stock" data-i18n="testCollection">Testcollectie</span></div>
    <h3><a href="{{ product.product_url }}">{{ product.name }}</a></h3>
    <div class="product-bottom">
      <strong>{{ format_eur(product.price) }}</strong>
      <form class="card-cart-form" action="/winkelwagen" method="post">
        <input type="hidden" name="action" value="add">
        <input type="hidden" name="product_id" value="{{ product.id }}">
        <button type="submit" class="card-add" aria-label="Toevoegen aan winkelwagen">＋ <span data-i18n="addShort">Toevoegen</span></button>
      </form>
    </div>
  </div>
</article>
