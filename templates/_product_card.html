<article class="product-card" data-product-card data-price="{{ product.price }}" data-name="{{ product.name|lower }}">
  <a class="product-image" href="/product/{{ product.category_slug }}/{{ product.index }}" aria-label="{{ product.name }}">
    {% if product.image %}<img src="{{ product.image }}" alt="{{ product.name }}" loading="lazy" decoding="async" data-fallback-icon="{{ product.icon|default('✨') }}">{% else %}<span class="image-fallback">{{ product.icon|default('✨') }}</span>{% endif %}
    <span class="product-badge" data-i18n="curatedBadge">TrendMix selectie</span>
  </a>
  <div class="product-body">
    <span class="product-category" data-category-name="{{ product.category_slug }}">{{ product.category_name }}</span>
    <h3><a href="/product/{{ product.category_slug }}/{{ product.index }}">{{ product.name }}</a></h3>
    <div class="product-bottom">
      <strong>€ {{ "%.2f"|format(product.price) }}</strong>
      <form class="card-cart-form" action="/winkelwagen" method="post">
        <input type="hidden" name="action" value="add">
        <input type="hidden" name="product_id" value="{{ product.category_slug }}-{{ product.index }}">
        <button type="submit" class="card-add" aria-label="Toevoegen aan winkelwagen">＋</button>
      </form>
    </div>
  </div>
</article>
