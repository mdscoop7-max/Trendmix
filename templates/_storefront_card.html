<article class="item"><form action="/wishlist" method="post" class="heartform"><input type="hidden" name="product_id" value="{{ product.id }}"><button aria-label="Favorieten" type="submit">{% if product.id in wishlist_ids %}♥{% else %}♡{% endif %}</button></form><a class="photo" href="{{ product.product_url }}">{% if product.image %}<img src="{{ product.image }}" alt="{{ product.name }}" loading="lazy">{% else %}<span>{{ product.icon|default('✦') }}</span>{% endif %}{% if product.badge %}<span class="flag">{{ product.badge }}</span>{% endif %}</a><div class="iteminfo"><small>{{ product.category_name }}</small><h3><a href="{{ product.product_url }}">{{ product.name }}</a></h3><strong>{{ format_eur(product.price) }}</strong><form action="/winkelwagen" method="post"><input type="hidden" name="action" value="add"><input type="hidden" name="product_id" value="{{ product.id }}"><button class="add" type="submit">🛒 &nbsp; Toevoegen</button></form></div></article>
