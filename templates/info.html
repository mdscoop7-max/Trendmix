<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#101114">
  <title>{{ title }} | TrendMix</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="https://trendmix-jet.vercel.app{{ path }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='ux.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='language-sticky.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
<div class="announcement"><div class="shell announcement-inner"><span data-i18n="topline">Nieuwe collectie · 5 duidelijke categorieën · mobiel klaar</span><label class="language-picker"><span>🌐</span><select id="languageSelect" aria-label="Taal"><option value="nl">🇳🇱 Nederlands</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option><option value="es">🇪🇸 Español</option></select></label></div></div>
<header class="site-header"><div class="shell header-main"><a class="brand" href="/" aria-label="TrendMix home"><span>Trend</span><b>Mix</b></a><a class="header-cta" href="/#collecties" data-i18n="discover">Ontdek</a></div></header>
<main class="shell info-page">
  <a class="back-link" href="/" data-i18n="backToCollection">← Terug naar TrendMix</a>
  <article class="info-card">
    <span class="eyebrow dark">TrendMix</span>
    <h1>{{ title }}</h1>
    <div class="info-content">{{ content|safe }}</div>
  </article>
</main>
{% include '_footer.html' %}
</body>
</html>
