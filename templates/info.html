<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#101114">
  <title>{{ title }} | TrendMix</title>
  <meta name="description" content="{{ description }}" data-meta-description>
  <link rel="canonical" href="https://trendmix.onrender.com{{ path }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml"><link rel="stylesheet" href="{{ url_for('static', filename='design-tokens.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='ux.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
{% include "_header.html" %}
<main class="shell info-page">
  <a class="back-link" href="/" data-i18n="backToTrendmix">← Terug naar TrendMix</a>
  <article class="info-card">
    <span class="eyebrow dark">TrendMix</span>
    <h1 data-info-title="{{ info_slug }}">{{ title }}</h1>
    <div data-info-content="{{ info_slug }}">{{ content|safe }}</div>
  </article>
</main>
{% include '_footer.html' %}
</body>
</html>
