<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Winkelwagen | TrendMix</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script defer src="{{ url_for('static', filename='app.js') }}"></script></head><body><header class="site-header"><div class="shell header-main"><a class="brand" href="/"><span>Trend</span><b>Mix</b></a><a class="cart-link" href="/winkelwagen">🛒 <span data-cart-count>0</span></a></div></header><main class="shell cart-page"><a class="back-link" href="/">← Verder winkelen</a><section class="cart-panel"><span class="eyebrow dark">TrendMix</span><h1>Je winkelwagen</h1><div id="cartItems"></div><div class="cart-total"><strong>Totaal</strong><strong id="cartTotal">€ 0,00</strong></div><p class="price-note">Afrekenen wordt geactiveerd zodra de betaal- en leverancierkoppeling is aangesloten.</p></section></main>{% include '_footer.html' %}<script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('cartItems'),t=document.getElementById('cartTotal'),c=trendmixCart();if(!c.length){b.innerHTML='<div class="empty-state"><h3>Je winkelwagen is leeg</h3><p>Voeg producten toe vanuit een collectie.</p></div>';return;}let s=0;b.innerHTML=c.map((x,i)=>{s+=Number(x.price||0)*Number(x.qty||1);return '<div class="cart-row"><img src="'+(x.image||'')+'" alt=""><div><strong>'+x.name+'</strong><span>'+x.qty+' × € '+Number(x.price||0).toFixed(2).replace('.',',')+'</span></div><button data-remove="'+i+'">×</button></div>'}).join('');t.textContent='€ '+s.toFixed(2).replace('.',',');b.querySelectorAll('[data-remove]').forEach(q=>q.onclick=()=>{const n=trendmixCart();n.splice(Number(q.dataset.remove),1);localStorage.setItem('trendmix-cart',JSON.stringify(n));location.reload()})});</script></body></html>
