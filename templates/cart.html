<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Winkelwagen | TrendMix</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='ux.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='language-sticky.css') }}"><script defer src="{{ url_for('static', filename='app.js?v=20260919-10') }}"></script></head><body><label class="language-picker"><span>🌐</span><select id="languageSelect" aria-label="Taal"><option value="nl">🇳🇱 Nederlands</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option><option value="es">🇪🇸 Español</option></select></label>
<header class="site-header"><div class="shell header-main"><a class="brand" href="/" aria-label="TrendMix home"><span>Trend</span><b>Mix</b></a><button class="header-contact" type="button" data-contact-open>✉ Contact</button><a class="cart-link" href="/winkelwagen" aria-label="Winkelwagen">🛒 <span data-cart-count>0</span></a><a class="header-cta" href="/#collecties">Ontdek</a></div></header><main class="shell cart-page"><a class="back-link" href="/">← Verder winkelen</a><section class="cart-panel"><span class="eyebrow dark">TrendMix</span><h1>Je winkelwagen</h1><div id="cartItems"></div><div class="cart-total"><strong>Totaal</strong><strong id="cartTotal">€ 0,00</strong></div><p class="price-note">Afrekenen wordt geactiveerd zodra de betaal- en leverancierkoppeling is aangesloten.</p></section></main><div class="cart-contact-link"><button type="button" class="btn btn-outline" data-contact-open>✉ Contact opnemen</button></div>{% include '_footer.html' %}<script>document.addEventListener('DOMContentLoaded',()=>{const key='trendmix-cart',b=document.getElementById('cartItems'),t=document.getElementById('cartTotal');const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}};const render=()=>{const c=read();if(!c.length){b.innerHTML='<div class="empty-state"><h3>Je winkelwagen is leeg</h3><p>Voeg producten toe vanuit een collectie.</p></div>';t.textContent='€ 0,00';return;}let s=0;b.innerHTML=c.map((x,i)=>{s+=Number(x.price||0)*Number(x.qty||1);return '<div class="cart-row"><img src="'+(x.image||'')+'" alt=""><div><strong>'+x.name+'</strong><span>'+x.qty+' × € '+Number(x.price||0).toFixed(2).replace('.',',')+'</span></div><button type="button" data-remove="'+i+'">×</button>'}).join('');t.textContent='€ '+s.toFixed(2).replace('.',',');b.querySelectorAll('[data-remove]').forEach(q=>q.onclick=()=>{const n=read();n.splice(Number(q.dataset.remove),1);localStorage.setItem(key,JSON.stringify(n));render()})};render();});</script></body></html>
