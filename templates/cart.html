<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Winkelwagen | TrendMix</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='ux.css', v='20260919-6') }}"><link rel="stylesheet" href="{{ url_for('static', filename='language-sticky.css') }}"><script defer src="{{ url_for('static', filename='app.js?v=20260919-13') }}"></script></head><body><label class="language-picker"><span>🌐</span><select id="languageSelect" aria-label="Taal"><option value="nl">🇳🇱 Nederlands</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option><option value="de">🇩🇪 Deutsch</option><option value="it">🇮🇹 Italiano</option><option value="es">🇪🇸 Español</option></select></label>
<header class="site-header"><div class="shell header-main"><a class="brand" href="/" aria-label="TrendMix home"><span>Trend</span><b>Mix</b></a><button class="header-contact" type="button" data-contact-open>✉ Contact</button><a class="cart-link" href="/winkelwagen" aria-label="Winkelwagen">🛒 <span data-cart-count>0</span></a><a class="header-cta" href="/#collecties">Ontdek</a></div></header><main class="shell cart-page"><a class="back-link" href="/">← Verder winkelen</a><section class="cart-panel"><span class="eyebrow dark">TrendMix</span><h1>Je winkelwagen</h1><div id="cartItems"></div><button type="button" class="btn btn-outline cart-clear" id="cartClear" hidden>Winkelwagen leegmaken</button><div class="cart-total"><strong>Totaal</strong><strong id="cartTotal">€ 0,00</strong></div><p class="price-note">Afrekenen wordt geactiveerd zodra de betaal- en leverancierkoppeling is aangesloten.</p></section></main><div class="cart-contact-link"><button type="button" class="btn btn-outline" data-contact-open>✉ Contact opnemen</button></div>{% include '_footer.html' %}<script>
document.addEventListener('DOMContentLoaded',()=>{\n  const params=new URLSearchParams(window.location.search);\n  const id=params.get('add_id'), name=params.get('add_name');\n  if(id && name && window.trendmixCart && window.saveTrendmixCart){\n    const cart=window.trendmixCart();\n    const found=cart.find(item=>item.id===id);\n    if(found){found.qty=Number(found.qty||1)+1;}else{cart.push({id,name,price:Number(params.get('add_price')||0),image:params.get('add_image')||'',qty:1});}\n    window.saveTrendmixCart(cart);\n    window.updateCartBadge?.();\n    window.history.replaceState({},'',window.location.pathname);\n  }
  const b=document.getElementById('cartItems'),t=document.getElementById('cartTotal'),clear=document.getElementById('cartClear');
  window.trendmixRenderCart=()=>{
    const c=window.trendmixCart?trendmixCart():[];
    if(!c.length){
      b.innerHTML='<div class="empty-state"><h3>Je winkelwagen is leeg</h3><p>Voeg producten toe vanuit een collectie.</p></div>';
      t.textContent='€ 0,00'; if(clear)clear.hidden=true; return;
    }
    let total=0;
    b.innerHTML=c.map((x,i)=>{
      const qty=Math.max(1,Number(x.qty||1)); const price=Number(x.price||0); total+=price*qty;
      const image=x.image?'<img src="'+String(x.image).replace(/"/g,'&quot;')+'" alt="">':'<div class="cart-thumb">🛍️</div>';
      return '<div class="cart-row">'+image+'<div><strong>'+String(x.name).replace(/</g,'&lt;')+'</strong><span>€ '+price.toFixed(2).replace('.',',')+' per stuk</span><div class="cart-qty"><button type="button" onclick="trendmixCartChange('+i+',-1)" aria-label="Aantal verminderen">−</button><b>'+qty+'</b><button type="button" onclick="trendmixCartChange('+i+',1)" aria-label="Aantal verhogen">+</button></div></div><button type="button" data-remove="'+i+'" onclick="trendmixCartRemove('+i+')" aria-label="Product verwijderen">×</button></div>';
    }).join('');
    t.textContent='€ '+total.toFixed(2).replace('.',','); if(clear)clear.hidden=false;
  };
  if(clear)clear.addEventListener('click',()=>trendmixCartClear());
  trendmixRenderCart();
});
</script></body></html>
